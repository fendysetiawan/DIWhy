<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: paint</title>
<!-- Project scene: paint the room. The "before": a tired, scuffed wall with a big peeling patch of old paint,
     a swatch card taped up, a paint can and roller tray waiting on a drop cloth. A paint flake drifts down. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("paint-room", {
  duration: 6,
  holdEnd: true, // keeps flaking for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The room, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // the wall: old, uneven paint
      g.r(0, 0, 480, 214, P.cream2);
      const r = W.rng(7);
      for (let k = 0; k < 40; k++) g.oval(r() * 480, 10 + r() * 190, 6 + r() * 20, 4 + r() * 12, P.peach, 0.12);
      for (let k = 0; k < 5; k++) g.oval(90, 40, 200 - k * 30, 120 - k * 20, P.goldL, 0.05);
      g.r(0, 0, 480, 6, P.creamL); g.r(0, 6, 480, 1, P.peach2); // ceiling line
      // a water stain up by the ceiling
      g.oval(70, 18, 30, 12, P.brownL, 0.2); g.oval(70, 18, 26, 10, P.cream2, 0.35); g.oval(72, 16, 22, 8, P.brownL, 0.14);
      // the ghost of a picture frame: cleaner paint where it hung, and its nail
      g.r(64, 60, 56, 70, P.cream); g.r(64, 60, 56, 1, P.peach, 0.6); g.r(64, 129, 56, 1, P.peach, 0.6); g.p(91, 54, P.slate); g.p(92, 55, P.ink, 0.5);
      // the big peeling patch: old blue paint and bare plaster under the cream
      const pr = W.rng(11), patch = [];
      for (let i = 0; i < 30; i++) { const a = i / 30 * 6.283, f = i === 3 ? 1 : 0.72 + pr() * 0.38; patch.push([Math.round(244 + Math.cos(a) * 70 * f), Math.round(98 + Math.sin(a) * 50 * f)]); }
      g.poly(patch.map(([x, y]) => [x + 1, y + 2]), P.brown, 0.45);
      g.poly(patch, P.blue2);
      g.oval(214, 78, 22, 12, P.blueL, 0.4); g.oval(270, 118, 18, 10, P.blueL, 0.3);
      g.poly([[226, 90], [262, 84], [276, 108], [250, 126], [222, 116]], P.creamL); g.dith(232, 94, 34, 24, P.peach, 0, 0.35);
      g.poly([[226, 90], [262, 84], [263, 86], [227, 92]], P.brown2, 0.4);
      // the cream edge curling up around the patch
      for (let i = 0; i < patch.length; i += 3) { const [x, y] = patch[i]; g.r(x - 2, y - 1, 5, 2, P.creamL); g.r(x - 1, y + 1, 4, 1, P.brown, 0.4); }
      // hairline cracks running off it
      [[...patch[28], 1, -1], [...patch[19], -1, -1], [...patch[5], 1, 1], [...patch[15], -1, 0]].forEach(([x, y, dx, dy], n) => {
        const q = W.rng(n + 3); for (let i = 0; i < 26; i++) { x += dx || (q() < 0.5 ? 1 : -1); y += dy || (q() < 0.4 ? 1 : 0); if (q() < 0.3) x += dx; g.p(x, y, P.brown2, 0.55); }
      });
      // scuffs low on the wall, from furniture and shoes
      [[110, 196, 18], [150, 188, 10], [300, 200, 22], [402, 192, 14], [36, 204, 12]].forEach(([x, y, w]) => { g.r(x, y, w, 1, P.brown, 0.35); g.r(x + 3, y + 1, w - 6, 1, P.brownL, 0.3); });
      // the swatch card, taped up
      g.r(342, 79, 26, 52, P.ink, 0.15); g.r(340, 76, 26, 52, P.creamL); g.r(340, 127, 26, 1, P.peach);
      [P.blue2, P.leafL, P.goldL, P.pink].forEach((c, i) => { g.r(344, 80 + i * 12, 18, 9, c); g.r(344, 88 + i * 12, 18, 1, P.ink, 0.15); });
      g.r(337, 73, 10, 5, P.goldL, 0.7); g.r(359, 73, 10, 5, P.goldL, 0.7);
      // skirting (scuffed) and floor planks
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      [40, 128, 262, 420].forEach(x => g.r(x, 215, 8, 3, P.brownL, 0.5));
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      // the drop cloth, with folds and old splatters
      g.poly([[112, 226], [370, 222], [386, 268], [96, 270]], P.ink, 0.15);
      g.poly([[110, 224], [368, 220], [384, 266], [94, 268]], P.cream);
      g.r(110, 224, 258, 1, P.creamL); [[140, 230, 60], [250, 236, 90], [120, 252, 80], [300, 256, 70]].forEach(([x, y, w]) => g.r(x, y, w, 1, P.peach));
      [[130, 240, 3], [338, 232, 2], [214, 262, 3], [364, 258, 2]].forEach(([x, y, s]) => g.oval(x, y, s * 2, s, P.blue2));
      // the paint can, lid off and leaning
      g.oval(166, 253, 20, 3, P.ink, 0.25);
      g.r(150, 218, 32, 34, P.cream); g.r(150, 218, 4, 34, P.creamL); g.r(176, 218, 6, 34, P.peach);
      g.r(150, 232, 32, 16, P.blue); g.r(150, 232, 32, 2, P.blueL); g.r(160, 237, 12, 6, P.creamL); g.r(162, 239, 8, 2, P.blue2);
      g.r(148, 214, 36, 5, P.slate); g.r(148, 214, 36, 1, P.blueL); g.r(150, 215, 32, 2, P.blue);
      g.r(150, 250, 32, 2, P.peach2);
      g.oval(200, 254, 14, 3, P.slate); g.oval(200, 253, 10, 2, P.blue);
      // the roller tray and roller
      g.poly([[248, 244], [332, 240], [328, 258], [252, 260]], P.slate); g.r(252, 258, 76, 2, P.ink, 0.25);
      g.r(254, 241, 72, 4, P.blue); g.r(254, 241, 72, 1, P.blueL);
      g.r(262, 232, 40, 9, P.cream); g.r(262, 232, 40, 2, P.creamL); g.r(262, 239, 40, 2, P.peach); g.r(262, 236, 40, 2, P.blue2, 0.6);
      g.r(302, 235, 6, 2, P.slate); g.poly([[306, 234], [342, 226], [343, 229], [307, 237]], P.wood); g.poly([[306, 236], [342, 228], [343, 229], [307, 237]], P.wood2);
    });
    // the paint drip creeping down the can, the flake, the curling flap of old paint
    const blue = W.paint(2, 2, g => g.r(0, 0, 2, 2, P.blue));
    const flake = W.paint(5, 3, g => { g.r(0, 0, 5, 3, P.creamL); g.r(0, 2, 5, 1, P.peach); g.p(4, 0, P.blue2); });
    const flap = W.paint(14, 8, g => { g.poly([[0, 8], [14, 6], [11, 2], [3, 0]], P.creamL); g.r(3, 6, 9, 2, P.brown, 0.4); g.r(4, 1, 6, 1, P.cream); });
    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.drip = W.layer(kit, blue, 177, 219, 2, 2);
    this.flake = W.layer(kit, flake, 0, 0, 5, 3);
    this.flap = W.layer(kit, flap, 290, 125, 14, 8);
    cam.append(this.drip, this.flap, this.flake);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    // a flake lets go of the patch and see-saws down onto the drop cloth, every 4 seconds
    const q = ((t / 4) % 1 + 1) % 1, f = Math.min(1, q / 0.8);
    this.flake.style.left = W.px(246 + Math.sin(f * 9) * 8 + f * 6) + 'px';
    this.flake.style.top = W.px(146 + f * 82) + 'px';
    this.flake.style.opacity = q < 0.9 ? 1 : ((1 - q) * 10).toFixed(2);
    // the loose flap of old paint lifts in a draft now and then
    const k = Math.floor(t * 6) % 9;
    this.flap.style.transform = 'translate(0,' + W.px(k === 2 || k === 3 ? -1 : 0) + 'px)';
    // a blue drip creeps down the side of the can, then starts again
    const d = ((t / 6) % 1 + 1) % 1;
    this.drip.style.height = W.px(2 + Math.floor(d * 11)) + 'px';
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
