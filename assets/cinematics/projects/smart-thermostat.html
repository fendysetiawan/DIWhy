<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: thermostat</title>
<!-- Project scene: install a smart thermostat. The "before": the hallway wall with the old beige dial
     thermostat, its needle twitching, heat shimmering off the wall vent, and the new smart thermostat
     still in its box on the side table. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("smart-thermostat", {
  duration: 6,
  holdEnd: true, // keeps twitching and shimmering for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The hallway, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // striped wallpaper above a chair rail, painted wainscot below
      g.r(0, 0, 480, 160, P.cream2);
      for (let x = 0; x < 480; x += 12) { g.r(x, 0, 4, 160, P.peach, 0.25); g.r(x + 4, 0, 1, 160, P.creamL, 0.3); }
      for (let k = 0; k < 5; k++) g.oval(110, 30, 220 - k * 32, 120 - k * 20, P.goldL, 0.05);
      g.r(0, 160, 480, 54, P.cream); g.r(0, 158, 480, 4, P.creamL); g.r(0, 162, 480, 2, P.peach2);
      for (let x = 30; x < 480; x += 90) { g.r(x, 172, 70, 1, P.peach2, 0.6); g.r(x, 172, 1, 32, P.peach2, 0.6); g.r(x, 204, 70, 1, P.creamL); g.r(x + 69, 172, 1, 33, P.creamL); }
      // a door frame at the far left
      g.r(0, 0, 20, 214, P.wood); g.r(18, 0, 4, 214, P.woodL); g.r(0, 0, 4, 214, P.wood2);
      // the ghost of an even older, bigger thermostat, and a patched screw hole
      g.r(170, 30, 140, 130, P.cream, 0.7); g.r(170, 30, 140, 1, P.peach2, 0.5); g.r(170, 30, 1, 128, P.peach2, 0.5);
      g.p(176, 36, P.brown, 0.6); g.p(303, 36, P.creamL);
      // the old dial thermostat, big and beige
      g.r(184, 46, 120, 112, P.ink, 0.2);
      g.r(180, 40, 120, 112, P.cream); g.r(180, 40, 120, 2, P.creamL); g.r(180, 40, 2, 112, P.creamL);
      g.r(296, 40, 4, 112, P.peach); g.r(180, 148, 120, 4, P.peach2);
      g.oval(280, 60, 20, 14, P.goldL, 0.25); g.oval(198, 140, 14, 6, P.brownL, 0.2); // yellowed plastic, grubby fingers
      g.oval(240, 92, 46, 46, P.peach2); g.oval(240, 92, 43, 43, P.cream2); g.oval(240, 92, 37, 37, P.creamL);
      g.oval(214, 64, 8, 3, P.creamL, 0.8);
      // the scale: ticks round the top, cool blue on the left to warm red on the right
      for (let i = 0; i <= 16; i++) {
        const a = Math.PI + i * Math.PI / 16, l = i % 4 ? 3 : 6;
        for (let d = 0; d < l; d++) g.p(240 + Math.cos(a) * (34 - d), 92 + Math.sin(a) * (34 - d), P.brown);
        g.p(240 + Math.cos(a) * 26, 92 + Math.sin(a) * 26, i < 8 ? P.blue : P.terra); g.p(240 + Math.cos(a) * 26 + 1, 92 + Math.sin(a) * 26, i < 8 ? P.blue : P.terra);
      }
      // a hairline crack in the cover and the set-point slider
      for (let i = 0; i < 12; i++) g.p(276 + i, 120 + Math.round(i * 0.6 + (i % 3 ? 0 : 1)), P.brownL, 0.7);
      g.r(212, 134, 56, 4, P.peach2); g.r(212, 134, 56, 1, P.brown, 0.4); g.r(232, 129, 8, 12, P.brownL); g.r(232, 129, 8, 2, P.peach);
      // the wall vent down low, its grille dusty
      g.r(54, 192, 68, 18, P.slate); g.r(56, 194, 64, 14, P.slate2);
      for (let i = 0; i < 4; i++) { g.r(58, 196 + i * 3, 60, 1, P.slate); g.r(58, 197 + i * 3, 60, 1, P.ink); }
      g.r(54, 192, 68, 1, P.blueL, 0.5); g.dith(56, 194, 64, 2, P.cream2, 0, 0.4);
      // skirting and floor planks
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      // the side table with the new smart thermostat still boxed up
      g.r(362, 220, 92, 4, P.ink, 0.2);
      g.r(356, 166, 96, 6, P.wood); g.r(356, 166, 96, 2, P.woodL); g.r(360, 172, 88, 8, P.wood2);
      g.r(364, 180, 5, 40, P.wood2); g.r(439, 180, 5, 40, P.wood2); g.r(364, 180, 1, 40, P.wood);
      g.r(380, 140, 52, 26, P.ink, 0.2);
      g.r(376, 136, 52, 30, P.blue); g.r(376, 136, 52, 2, P.blueL); g.r(424, 136, 4, 30, P.blue3); g.r(376, 158, 48, 3, P.creamL);
      g.oval(400, 147, 9, 9, P.ink); g.oval(400, 147, 7, 7, P.slate2); g.oval(400, 147, 4, 4, P.blue2); g.p(399, 145, P.gold); g.p(400, 145, P.gold);
      g.r(386, 134, 4, 6, P.goldL, 0.7); g.r(414, 134, 4, 6, P.goldL, 0.7);
      g.r(434, 162, 12, 3, P.terra); g.r(434, 162, 12, 1, P.terraL); g.r(422, 163, 12, 1, P.slate); // a screwdriver
    });
    // needle frames: a red needle on a hub, drawn at a few angles so it can twitch in whole pixels
    const needle = a => W.paint(120, 112, g => {
      for (let d = 0; d < 30; d++) { const x = 60 + Math.cos(a) * d, y = 52 + Math.sin(a) * d; g.p(x, y, P.terra); if (d < 20) g.p(x + 1, y, P.terra2); }
      g.oval(60, 52, 5, 5, P.slate); g.oval(59, 51, 2, 2, P.creamL);
    });
    const base = -Math.PI * 0.36;
    this.frames = [-0.1, -0.04, 0, 0.05].map(o => 'url(' + needle(base + o) + ')');
    const wave = W.paint(3, 12, g => { for (let y = 0; y < 12; y++) g.p(1 + Math.round(Math.sin(y * 0.8)), y, P.peach2); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.needle = W.layer(kit, needle(base), 180, 40, 120, 112);
    this.waves = [0, 1, 2, 3, 4].map(() => W.layer(kit, wave, 0, 0, 3, 12));
    cam.append(this.needle, ...this.waves);
    this.last = -1;
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    // the needle sits, then twitches as the old bimetal coil can't decide
    const seq = [2, 2, 2, 1, 2, 2, 3, 2, 2, 2, 0, 1, 2, 2, 3, 3, 2, 2];
    const f = seq[((Math.floor(t * 8) % seq.length) + seq.length) % seq.length];
    if (f !== this.last) { this.needle.style.backgroundImage = this.frames[f]; this.last = f; }
    // heat shimmers up off the vent
    this.waves.forEach((w, i) => {
      const q = ((t * 0.5 + i / 5) % 1 + 1) % 1;
      w.style.left = W.px(62 + i * 12 + Math.sin(t * 3 + i) * 1.5) + 'px'; w.style.top = W.px(180 - q * 44) + 'px';
      w.style.opacity = (Math.sin(q * Math.PI) * 0.8).toFixed(2);
    });
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
