<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: dryer</title>
<!-- Project scene: replace the smoking dryer. The "before": the laundry alcove, the old dryer rattling
     and smoking, a crushed vent hose, lint on the floor, a crooked shelf. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("dryer-replacement", {
  duration: 6,
  holdEnd: true, // keeps rattling and smoking for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The laundry corner, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // wall with soft vertical panels
      g.r(0, 0, 480, 214, P.cream2);
      for (let x = 0; x < 480; x += 40) { g.r(x, 0, 1, 214, P.peach, 0.5); g.r(x + 1, 0, 1, 214, P.creamL, 0.5); }
      for (let k = 0; k < 5; k++) g.oval(90, 40, 200 - k * 30, 120 - k * 20, P.goldL, 0.05);
      // the alcove: a darker recess
      g.r(146, 52, 188, 162, P.peach2); g.r(146, 52, 188, 3, P.brown, 0.5); g.r(146, 52, 3, 162, P.brown, 0.35); g.r(331, 52, 3, 162, P.creamL, 0.5);
      // scorch marks behind the dryer, up the back wall
      g.oval(300, 104, 26, 30, P.brown, 0.35); g.oval(306, 96, 16, 20, P.brown2, 0.4); g.oval(310, 90, 8, 10, P.ink, 0.3);
      // skirting and floor planks
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      // a dent in the floor where the old dryer was dragged
      g.r(196, 224, 22, 3, P.wood2); g.r(196, 224, 22, 1, P.ink, 0.4);
      // lint drifts on the floor
      [[150, 222, 10], [322, 224, 14], [352, 226, 8], [120, 230, 6]].forEach(([x, y, w]) => { g.oval(x, y, w, 3, P.slate2, 0.9); g.oval(x - 2, y - 1, w * 0.6, 2, P.creamL, 0.5); });
      // the crushed foil vent hose, from the dryer's back to the wall
      for (let i = 0; i < 26; i++) { const x = 304 + i, y = 120 + Math.round(Math.sin(i * 0.9) * 2) + (i > 14 ? 6 : 0); g.r(x, y, 1, 6, i % 2 ? P.cream : P.slate2); g.p(x, y, P.creamL); }
      g.r(328, 112, 6, 22, P.slate); // the wall duct
      // the crooked shelf above, with a detergent bottle sliding off
      g.poly([[170, 70], [312, 62], [312, 66], [170, 74]], P.wood); g.poly([[170, 74], [312, 66], [312, 68], [170, 76]], P.wood2);
      g.r(178, 74, 3, 8, P.slate); g.r(300, 66, 3, 8, P.slate);
      g.r(274, 44, 16, 20, P.blue); g.r(274, 44, 16, 3, P.blueL); g.r(278, 40, 8, 4, P.cream); g.r(277, 52, 10, 6, P.creamL);
      g.r(214, 56, 22, 14, P.terra); g.r(214, 56, 22, 2, P.terraL); // a box of dryer sheets
    });
    // the dryer, drawn on its own so it can rattle
    const dryer = W.paint(130, 112, g => {
      g.r(4, 108, 124, 4, P.ink, 0.25); // shadow
      g.r(0, 0, 126, 108, P.cream); g.r(0, 0, 126, 2, P.creamL); g.r(122, 0, 4, 108, P.peach); g.r(0, 104, 126, 4, P.peach2);
      // control panel
      g.r(0, 0, 126, 20, P.cream2); g.r(0, 20, 126, 2, P.peach);
      g.oval(18, 10, 6, 6, P.slate); g.oval(17, 9, 3, 3, P.creamL);
      g.r(36, 6, 40, 8, P.slate2); g.r(38, 8, 10, 4, P.gold); // the little display
      g.oval(102, 10, 6, 6, P.slate); g.oval(101, 9, 3, 3, P.creamL);
      // the round door
      g.oval(63, 64, 34, 34, P.slate); g.oval(63, 64, 30, 30, P.peach2); g.oval(63, 64, 26, 26, P.slate2);
      g.oval(56, 56, 8, 5, P.creamL, 0.35); // glass shine
      g.r(98, 60, 6, 10, P.slate); // handle
      // a yellowed scorch on the top corner
      g.oval(116, 4, 10, 4, P.brownL, 0.5);
    });
    // a sock tumbling round inside the door
    const sock = W.paint(10, 6, g => { g.r(0, 1, 7, 4, P.terra); g.r(5, 0, 4, 6, P.terra); g.r(0, 1, 7, 1, P.terraL); });
    const puff = W.paint(12, 12, g => { g.oval(6, 6, 6, 6, P.slate2, 0.85); g.oval(5, 5, 3, 3, P.creamL, 0.4); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.dryer = W.layer(kit, dryer, 175, 110, 130, 112);
    this.sock = W.layer(kit, sock, 0, 0, 10, 6);
    this.dryer.append(this.sock);
    this.puffs = [0, 1, 2, 3, 4, 5].map(() => W.layer(kit, puff, 0, 0, 12, 12));
    cam.append(this.dryer, ...this.puffs);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    // the dryer rattles: a whole-pixel shake, a few times a second
    const k = Math.floor(t * 14) % 4;
    this.dryer.style.transform = 'translate(' + W.px([0, 1, 0, -1][k]) + 'px,' + W.px([0, 0, -1, 0][k]) + 'px)';
    // the sock goes round and round behind the glass (art units inside the dryer)
    const a = t * 5;
    this.sock.style.left = W.px(58 + Math.cos(a) * 16) + 'px'; this.sock.style.top = W.px(61 + Math.sin(a) * 16) + 'px';
    // smoke curls up from behind the dryer's back corner
    this.puffs.forEach((p, i) => {
      const q = ((t * 0.35 + i / 6) % 1 + 1) % 1;
      p.style.left = W.px(292 + Math.sin(q * 6 + i) * 6 + q * 10) + 'px'; p.style.top = W.px(104 - q * 90) + 'px';
      p.style.opacity = (q < 0.1 ? q * 9 : 0.9 - q * 0.85).toFixed(2);
      p.style.transform = 'scale(' + (1 + q * 1.5).toFixed(2) + ')';
    });
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
