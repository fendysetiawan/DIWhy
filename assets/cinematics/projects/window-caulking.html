<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: windows</title>
<!-- Project scene: re-caulk the windows. The "before": a window seen from inside on a rainy day, the old
     caulk yellowed and cracked, paint peeling off the trim, the curtain blowing in the draft and rain
     dripping off the sill into a puddle. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("window-caulking", {
  duration: 6,
  holdEnd: true, // keeps raining and drafting for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit), R = W.rng(11);
    // a curtain panel: vertical folds, the hem pushed sideways by `bend` art px (more at the bottom)
    const curtain = (g, x0, y0, w, h, bend) => {
      for (let y = 0; y < h; y++) {
        const o = x0 + Math.round(bend * Math.pow(y / h, 2)), hem = y > h - 5;
        g.r(o, y0 + y, w, 1, hem ? P.terra2 : P.terra);
        if (!hem) for (let k = 0; k < w; k += 10) { g.r(o + k, y0 + y, 2, 1, P.terra2); g.r(o + k + 3, y0 + y, 2, 1, P.terraL); }
        g.p(o, y0 + y, P.brown); g.p(o + w - 1, y0 + y, P.brown2);
      }
    };
    // The window wall, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      g.r(0, 0, 480, 214, P.cream2);
      for (let x = 0; x < 480; x += 40) { g.r(x, 0, 1, 214, P.peach, 0.5); g.r(x + 1, 0, 1, 214, P.creamL, 0.5); }
      for (let k = 0; k < 5; k++) g.oval(90, 40, 200 - k * 30, 120 - k * 20, P.goldL, 0.05);
      // outside, through the glass: a heavy grey sky, the neighbour's roof, a soggy tree and lawn
      g.r(172, 46, 136, 118, P.blue2); g.dith(172, 46, 136, 40, P.blueL, 0, 0.5);
      [[196, 52, 30, 9], [262, 50, 36, 10], [300, 58, 20, 6]].forEach(([x, y, w, h]) => g.oval(x, y, w, h, P.slate, 0.35));
      g.poly([[248, 164], [248, 130], [286, 112], [308, 124], [308, 164]], P.blue3, 0.55);
      g.r(194, 128, 3, 36, P.brown, 0.6); g.oval(196, 124, 20, 16, P.leaf2, 0.75); g.oval(190, 119, 10, 8, P.leaf, 0.6);
      g.r(172, 152, 136, 12, P.leaf2, 0.6);
      g.r(180, 54, 2, 30, P.creamL, 0.3); g.r(184, 54, 1, 18, P.creamL, 0.3); g.r(248, 112, 2, 24, P.creamL, 0.25);
      // the trim and sash, shaded on the right
      g.r(160, 34, 160, 12, P.creamL); g.r(160, 34, 12, 142, P.creamL); g.r(308, 34, 12, 142, P.cream); g.r(160, 164, 160, 12, P.cream);
      g.r(160, 34, 160, 1, P.peach); g.r(319, 34, 1, 142, P.peach2); g.r(172, 46, 136, 2, P.brown, 0.35); g.r(172, 46, 2, 118, P.brown, 0.25);
      g.r(238, 46, 4, 118, P.cream); g.r(238, 46, 1, 118, P.creamL); g.r(241, 46, 1, 118, P.peach);
      g.r(172, 102, 136, 5, P.cream); g.r(172, 102, 136, 1, P.creamL); g.r(172, 106, 136, 1, P.peach);
      // the old caulk: a yellowed bead round every pane, cracked and gapped where it has let go
      [[172, 46, 66, 56], [242, 46, 66, 56], [172, 107, 66, 57], [242, 107, 66, 57]].forEach(([x, y, w, h]) => {
        g.r(x, y, w, 2, P.goldL, 0.8); g.r(x, y + h - 2, w, 2, P.goldL, 0.8); g.r(x, y, 2, h, P.goldL, 0.8); g.r(x + w - 2, y, 2, h, P.goldL, 0.8);
        for (let i = 0; i < 9; i++) {
          const s = R(), a = Math.floor(R() * 4), L = 2 + Math.floor(R() * 5);
          const cx = a < 2 ? x + Math.floor(s * (w - L)) : (a === 2 ? x : x + w - 2), cy = a < 2 ? (a ? y + h - 2 : y) : y + Math.floor(s * (h - L));
          if (i % 3) { g.p(cx, cy, P.ink, 0.7); g.p(cx + 1, cy + 1, P.brown2, 0.6); } else g.r(cx, cy, a < 2 ? L : 2, a < 2 ? 2 : L, P.slate, 0.8);
        }
      });
      // paint peeling off the trim: bare wood showing, flakes curling up
      [[163, 120, 6, 14], [311, 60, 5, 18], [200, 167, 22, 6], [280, 36, 16, 6], [163, 62, 5, 8], [296, 168, 10, 5]].forEach(([x, y, w, h]) => {
        g.r(x, y, w, h, P.woodL); g.r(x, y, w, 1, P.wood); g.p(x + w - 1, y + h - 1, P.wood2);
        g.r(x - 1, y - 2, 3, 2, P.creamL); g.p(x - 1, y, P.brownL); g.r(x + w - 2, y + h, 3, 1, P.creamL); g.p(x + w, y + h + 1, P.peach2);
      });
      // the sill, wet on top, with a water stain running down the wall below it
      g.r(150, 176, 180, 7, P.creamL); g.r(150, 176, 180, 1, P.cream); g.r(150, 182, 180, 2, P.peach2);
      g.oval(250, 179, 18, 2, P.blueL, 0.8); g.r(244, 178, 8, 1, P.creamL, 0.7); g.oval(206, 179, 6, 1, P.blueL, 0.7);
      g.r(166, 184, 148, 8, P.cream); g.r(166, 191, 148, 1, P.peach2);
      g.oval(252, 202, 12, 10, P.brownL, 0.22); g.r(250, 192, 4, 22, P.brownL, 0.2);
      // the curtain rod and the right-hand curtain, tied back
      curtain(g, 322, 28, 34, 168, -6);
      g.r(318, 92, 34, 4, P.gold); g.r(318, 92, 34, 1, P.goldL);
      g.r(112, 24, 256, 3, P.brown); g.r(112, 24, 256, 1, P.brownL); g.oval(112, 25, 4, 4, P.gold); g.oval(368, 25, 4, 4, P.gold);
      // skirting and floor planks, a puddle under the drip, a towel bunched against the wall
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      g.oval(252, 238, 16, 3, P.blueL, 0.75); g.oval(248, 237, 6, 1, P.creamL, 0.6);
      g.oval(130, 222, 22, 6, P.blue); g.oval(126, 220, 14, 3, P.blueL); g.r(112, 222, 36, 1, P.blue3, 0.6);
    });
    // the left curtain, painted in a few bends so the draft can push it about
    const frames = [0, 2, 4, 6, 8].map(b => W.paint(52, 152, g => curtain(g, 2, 0, 40, 150, b)));
    const rain = W.paint(1, 5, g => { g.r(0, 0, 1, 5, P.blueL); g.p(0, 4, P.creamL); });
    const drop = W.paint(3, 4, g => { g.r(1, 0, 1, 1, P.blueL); g.r(0, 1, 3, 3, P.blueL); g.p(0, 1, P.creamL); });
    const splash = W.paint(9, 3, g => { g.p(0, 0, P.blueL); g.p(8, 0, P.blueL); g.p(2, 1, P.creamL); g.p(6, 1, P.creamL); g.r(3, 2, 3, 1, P.blueL); });
    const flake = W.paint(4, 3, g => { g.r(0, 0, 4, 2, P.creamL); g.r(1, 2, 3, 1, P.peach2); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    const xs = []; for (let x = 176; x < 304; x += 8) if (x < 236 || x > 244) xs.push(x);
    this.rain = xs.map(x => ({ el: W.layer(kit, rain, x + Math.floor(R() * 4), 46, 1, 5), ph: R() }));
    this.frames = frames;
    this.curtain = W.layer(kit, frames[0], 120, 27, 52, 152);
    this.drop = W.layer(kit, drop, 251, 192, 3, 4);
    this.splash = W.layer(kit, splash, 248, 234, 9, 3);
    this.flake = W.layer(kit, flake, 162, 116, 4, 3);
    cam.append(...this.rain.map(r => r.el), this.flake, this.curtain, this.drop, this.splash);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    const f = v => ((v % 1) + 1) % 1;
    // rain streaks down the glass outside (hidden behind the meeting rail)
    this.rain.forEach(r => {
      const y = 46 + Math.floor(f(t * 0.7 + r.ph) * 112);
      r.el.style.top = W.px(y) + 'px'; r.el.style.opacity = y > 97 && y < 108 ? 0 : 0.85;
    });
    // the draft gusts through the gaps: the curtain hem billows out and settles
    const gust = Math.max(0, Math.sin(t * 1.3) * 0.7 + Math.sin(t * 3.1) * 0.3);
    const k = Math.min(4, Math.floor(gust * 5));
    if (this.k !== k) { this.k = k; this.curtain.style.backgroundImage = 'url(' + this.frames[k] + ')'; }
    this.flake.style.transform = 'translate(0,' + W.px(gust > 0.5 && Math.floor(t * 10) % 2 ? -1 : 0) + 'px)';
    // a drip gathers under the sill, lets go, and splashes into the puddle
    const q = f(t / 1.8);
    this.drop.style.opacity = q < 0.8 ? 1 : 0;
    this.drop.style.top = W.px(q < 0.55 ? 192 : 192 + Math.pow(Math.min(1, (q - 0.55) / 0.25), 2) * 42) + 'px';
    this.splash.style.opacity = q >= 0.8 && q < 0.92 ? 1 : 0;
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
