<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: kitchen faucet</title>
<!-- Project scene: swap the kitchen faucet. The "before": the sink under the window, a tired old
     gooseneck faucet crusted with scale, dripping into the basin, its loose handle wobbling,
     subway-tile backsplash and the cabinet below. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("kitchen-faucet", {
  duration: 6,
  holdEnd: true, // keeps dripping for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The kitchen sink wall, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      g.r(0, 0, 480, 224, P.cream2);
      for (let k = 0; k < 5; k++) g.oval(90, 30, 200 - k * 30, 110 - k * 20, P.goldL, 0.05);
      // the window over the sink
      g.r(174, 4, 132, 64, P.creamL); g.r(180, 10, 120, 52, P.blue2); g.r(180, 44, 120, 18, P.grass);
      g.oval(214, 46, 22, 8, P.grass2); g.oval(272, 48, 18, 7, P.leaf2); g.oval(206, 22, 6, 6, P.goldL);
      g.r(238, 10, 4, 52, P.creamL); g.r(180, 10, 120, 2, P.ink, 0.2); g.r(170, 66, 140, 4, P.cream);
      // subway-tile backsplash
      g.r(0, 70, 480, 82, P.creamL);
      for (let y = 70, i = 0; y < 152; y += 8, i++) { g.r(0, y, 480, 1, P.peach); for (let x = (i % 2) * 8; x < 480; x += 16) { g.r(x, y + 1, 1, 7, P.peach); g.r(x + 1, y + 1, 14, 1, P.cream, 0.6); } }
      g.oval(262, 146, 14, 5, P.brownL, 0.12); // a water stain splashed behind the tap
      // the countertop, seen from just above, with the sink cut into it
      g.r(0, 150, 480, 10, P.slate2); g.r(0, 150, 480, 1, P.blueL, 0.5);
      for (let i = 0; i < 40; i++) g.p((i * 97) % 480, 152 + (i * 7) % 7, P.blueL, 0.5);
      g.r(0, 160, 480, 6, P.slate); g.r(0, 165, 480, 1, P.ink, 0.4);
      g.r(176, 151, 128, 9, P.slate); g.r(178, 153, 124, 7, P.ink, 0.5); g.r(178, 153, 124, 1, P.blue3); g.r(176, 151, 128, 2, P.blue2);
      // the cabinets under the counter
      g.r(40, 166, 400, 58, P.wood); g.r(40, 166, 400, 2, P.woodL);
      [[44, 96], [144, 94], [242, 94], [340, 96]].forEach(([x, w], i) => {
        g.r(x, 170, w, 50, P.woodL, 0.35); g.r(x, 170, w, 1, P.creamL, 0.4); g.r(x + w - 1, 170, 1, 50, P.wood2); g.r(x + 6, 176, w - 12, 38, P.wood2, 0.25);
        g.r(i % 2 ? x + 6 : x + w - 10, 190, 3, 8, P.gold); });
      g.r(40, 220, 400, 4, P.wood2); // toe kick
      // the white apron-front sink, centred under the window
      g.r(178, 166, 128, 2, P.ink, 0.3); g.r(176, 158, 128, 40, P.creamL); g.r(176, 158, 3, 40, P.creamL); g.r(301, 158, 3, 40, P.cream2); g.r(176, 194, 128, 4, P.cream2); g.r(176, 198, 128, 2, P.ink, 0.25);
      g.r(180, 160, 120, 1, P.cream2); g.oval(200, 176, 10, 6, P.brownL, 0.12);
      // a dish towel hanging off a cabinet door
      g.r(108, 168, 18, 28, P.blue); g.r(108, 168, 18, 3, P.blueL); for (let x = 110; x < 126; x += 4) g.r(x, 176, 2, 18, P.blueL, 0.5);
      // floor planks
      g.r(0, 224, 480, 46, P.wood);
      for (let y = 224, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      // a sponge and a dish soap bottle on the counter
      g.r(140, 146, 16, 6, P.goldL); g.r(140, 150, 16, 2, P.leaf); g.r(326, 128, 12, 24, P.leaf); g.r(326, 128, 3, 24, P.leafL); g.r(329, 122, 6, 6, P.cream);
    });
    // the old faucet: base, gooseneck and spout, crusted with scale
    const tap = W.paint(80, 100, g => {
      g.r(6, 98, 46, 2, P.ink, 0.3); g.r(8, 92, 42, 7, P.blue2); g.r(8, 92, 42, 2, P.creamL); g.r(44, 92, 6, 7, P.blue3); // the base plate
      g.r(22, 26, 10, 68, P.blue2); g.r(22, 26, 3, 68, P.creamL); g.r(30, 26, 2, 68, P.blue3); // the riser
      for (let a = Math.PI; a <= 2 * Math.PI + 0.01; a += 0.015) for (let r = 11; r < 21; r++)
        g.p(Math.round(43 + Math.cos(a) * r), Math.round(26 + Math.sin(a) * r), r > 17 && a < 4.6 ? P.creamL : r < 13 ? P.blue3 : P.blue2); // the gooseneck
      g.r(54, 26, 10, 20, P.blue2); g.r(54, 26, 2, 20, P.blueL); g.r(62, 26, 2, 20, P.blue3); // the spout
      g.r(53, 44, 12, 5, P.slate); g.r(54, 48, 10, 2, P.cream); g.p(56, 49, P.creamL); g.p(60, 49, P.creamL); // the crusty aerator
      [[24, 60, 3, 3], [27, 76, 2, 4], [10, 95, 5, 2], [36, 95, 4, 2], [57, 34, 3, 2], [40, 9, 4, 2]].forEach(([x, y, w, h], i) => g.r(x, y, w, h, i % 2 ? P.brownL : P.cream, 0.85));
    });
    const handle = W.paint(24, 14, g => { g.r(0, 6, 8, 8, P.blue2); g.r(0, 6, 8, 2, P.creamL); g.r(4, 2, 20, 6, P.blue2); g.r(4, 2, 20, 2, P.creamL); g.r(4, 7, 20, 1, P.blue3); g.r(19, 3, 3, 3, P.blue); });
    const drop = W.paint(2, 3, g => { g.r(0, 0, 2, 3, P.blueL); g.p(0, 0, P.creamL); });
    const ripple = W.paint(14, 3, g => { g.r(0, 2, 3, 1, P.blueL); g.r(11, 2, 3, 1, P.blueL); g.r(4, 0, 2, 1, P.creamL); g.r(8, 0, 2, 1, P.creamL); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.handle = W.layer(kit, handle, 228, 120, 24, 14);
    cam.append(W.layer(kit, tap, 196, 52, 80, 100), this.handle);
    this.drop = W.layer(kit, drop, 254, 102, 2, 3);
    this.ripple = W.layer(kit, ripple, 248, 155, 14, 3);
    cam.append(this.drop, this.ripple);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    // a drop gathers at the crusty spout, lets go, and plinks into the basin
    const q = ((t / 1.4) % 1 + 1) % 1;
    const f = q < 0.45 ? 0 : (q - 0.45) / 0.4;
    this.drop.style.top = W.px(102 + Math.min(1, f) * Math.min(1, f) * 52) + 'px';
    this.drop.style.opacity = q < 0.15 || f >= 1 ? 0 : 1;
    this.ripple.style.opacity = f >= 1 && q < 0.95 ? 1 : 0;
    // the loose handle wobbles on its stem
    const k = Math.floor(t * 6) % 6;
    this.handle.style.transform = 'translateY(' + W.px([0, 0, -1, 0, 0, 1][k]) + 'px)';
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
