<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: carpet</title>
<!-- Project scene: replace the carpet. The "before": a room with tired, stained old carpet, one corner
     peeled back from the wall to show the subfloor and the tack strip, a loose strip lying on the floor,
     the corner flapping in a draught and dust drifting in the window light. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("carpet-replacement", {
  duration: 6,
  holdEnd: true, // keeps flapping for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The room, straight on, on the 480 x 270 art grid: a short wall and a lot of carpet. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // wall with soft vertical panels
      g.r(0, 0, 480, 130, P.cream2);
      for (let x = 0; x < 480; x += 40) { g.r(x, 0, 1, 130, P.peach, 0.5); g.r(x + 1, 0, 1, 130, P.creamL, 0.5); }
      // the window, and its light falling across the wall and floor
      g.r(56, 14, 96, 78, P.creamL); g.r(62, 20, 84, 66, P.blue2); g.r(62, 64, 84, 22, P.grass); g.oval(90, 66, 20, 7, P.leaf2);
      g.r(102, 20, 4, 66, P.creamL); g.r(62, 52, 84, 3, P.creamL); g.r(52, 92, 104, 4, P.cream);
      g.poly([[62, 96], [146, 96], [250, 270], [120, 270]], P.goldL, 0.12);
      // skirting
      g.r(0, 130, 480, 8, P.creamL); g.r(0, 137, 480, 2, P.peach2);
      // the old carpet: dusty, dithered pile
      g.r(0, 139, 480, 131, P.blueL); g.dith(0, 139, 480, 131, P.blue2, 0, 0.4);
      const r = W.rng(7); for (let i = 0; i < 260; i++) g.p(Math.floor(r() * 480), 139 + Math.floor(r() * 131), r() < 0.5 ? P.cream2 : P.blue3, 0.5);
      // a worn path and the stains
      g.oval(200, 230, 120, 26, P.cream2, 0.3); g.r(0, 139, 480, 3, P.blue3, 0.35);
      g.oval(180, 196, 30, 12, P.brownL, 0.45); g.oval(184, 194, 20, 8, P.brown, 0.35); g.oval(176, 198, 8, 3, P.brown2, 0.3);
      g.oval(96, 236, 16, 7, P.violet, 0.35); g.oval(300, 252, 22, 8, P.brownL, 0.35); g.oval(410, 238, 10, 4, P.brown, 0.3);
      g.oval(56, 172, 14, 5, P.leaf3, 0.18);
      // the peeled-back corner: plywood subfloor, the tack strip along the wall, old staples
      g.poly([[260, 139], [480, 139], [480, 258]], P.woodL);
      for (let i = 0; i < 6; i++) { const y = 139 + i * 20; g.r(Math.round(260 + (y - 139) * 220 / 119), y, 480, 1, P.wood, 0.5); }
      g.oval(420, 170, 10, 3, P.wood, 0.4); g.oval(452, 214, 6, 2, P.wood2, 0.4);
      g.r(276, 139, 204, 4, P.wood); g.r(276, 139, 204, 1, P.woodL);
      for (let x = 280; x < 480; x += 6) g.p(x, 140, P.slate2);
      [[360, 180], [404, 160], [446, 196], [430, 234]].forEach(([x, y]) => { g.r(x, y, 3, 1, P.slate); g.p(x + 1, y - 1, P.blueL); });
      // the loose tack strip lying across the carpet
      g.poly([[86, 214], [150, 204], [151, 207], [87, 217]], P.wood); g.poly([[86, 214], [150, 204], [150, 205], [86, 215]], P.woodL);
      for (let i = 0; i < 10; i++) g.p(90 + i * 6, 213 - i, P.slate2);
    });
    // the curled-up flap of carpet, painted in three poses so it lifts and settles a pixel at a time
    const flap = [[316, 226], [312, 218], [318, 232]].map(([tx, ty]) => W.paint(230, 140, g => {
      const o = (x, y) => [x - 250, y - 134];
      g.poly([o(258, 139), o(480, 258), o(tx + 8, ty + 8)], P.ink, 0.2); // shadow
      const tri = [o(260, 139), o(480, 258), o(tx, ty)];
      g.poly(tri, P.cream); // the jute backing, with a woven dither clipped to the flap
      const [[ax, ay], [bx, by], [cx, cy]] = tri, side = (x, y, px, py, qx, qy) => (qx - px) * (y - py) - (qy - py) * (x - px);
      for (let y = 0; y < 140; y++) for (let x = (y % 2); x < 230; x += 2) { const s1 = side(x + 0.5, y + 0.5, ax, ay, bx, by), s2 = side(x + 0.5, y + 0.5, bx, by, cx, cy), s3 = side(x + 0.5, y + 0.5, cx, cy, ax, ay);
        if ((s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0)) g.p(x, y, y % 6 ? P.cream2 : P.peach, 0.8); }
      g.poly([o(260, 139), o(480, 258), o(478, 259), o(259, 141)], P.blue2); // the pile showing at the fold
      g.r(tx - 250 - 1, ty - 134 - 1, 3, 3, P.creamL);
    }));
    const mote = W.paint(1, 1, g => g.p(0, 0, P.creamL));

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.flaps = flap;
    this.flap = W.layer(kit, flap[0], 250, 134, 230, 140);
    this.motes = [0, 1, 2, 3, 4, 5].map(() => W.layer(kit, mote, 0, 0, 1, 1));
    cam.append(this.flap, ...this.motes);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    // the peeled corner lifts in a draught and flops back down
    this.flap.style.backgroundImage = 'url(' + this.flaps[[0, 0, 1, 1, 0, 2, 0, 0][Math.floor(t * 4) % 8]] + ')';
    // dust drifts down through the window light
    this.motes.forEach((p, i) => {
      const q = ((t * 0.12 + i / 6) % 1 + 1) % 1;
      p.style.left = W.px(76 + i * 14 + q * 60 + Math.sin(q * 8 + i) * 4) + 'px'; p.style.top = W.px(100 + q * 120) + 'px';
      p.style.opacity = (q < 0.1 ? q * 8 : 0.8 - q * 0.7).toFixed(2);
    });
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
