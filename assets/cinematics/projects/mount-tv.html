<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: TV</title>
<!-- Project scene: mount the TV. The "before": a bare living-room wall, a big new TV leaning against it
     on the floor beside its open box, the wall bracket and a drill on the rug, pencil marks and a couple
     of missed holes, and a stud finder sliding along the wall, blinking. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("mount-tv", {
  duration: 6,
  holdEnd: true, // keeps blinking for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The living room, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // wall with soft vertical panels
      g.r(0, 0, 480, 214, P.cream2);
      for (let x = 0; x < 480; x += 40) { g.r(x, 0, 1, 214, P.peach, 0.5); g.r(x + 1, 0, 1, 214, P.creamL, 0.5); }
      for (let k = 0; k < 5; k++) g.oval(90, 40, 200 - k * 30, 120 - k * 20, P.goldL, 0.05);
      // a painter's-tape level line, pencil marks at the studs, two missed holes with crumbled plaster
      g.r(80, 66, 320, 2, P.blue2); g.r(80, 66, 320, 1, P.blueL, 0.6);
      [128, 192, 256, 320].forEach(x => { g.p(x - 1, 70, P.brown2); g.p(x + 1, 70, P.brown2); g.p(x, 71, P.brown2); g.p(x - 1, 72, P.brown2); g.p(x + 1, 72, P.brown2); });
      [[214, 80], [228, 84]].forEach(([x, y]) => { g.r(x, y, 2, 2, P.ink); g.p(x - 1, y - 1, P.peach2); g.p(x + 2, y + 2, P.peach2); g.r(x, y + 3, 2, 1, P.creamL); });
      // a framed picture, taken down and leaned to one side; its pale ghost on the wall
      g.r(380, 70, 50, 36, P.creamL, 0.5); g.r(404, 64, 2, 2, P.brown);
      // skirting, floor planks and a rug
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      g.r(60, 244, 360, 22, P.terra); g.r(60, 244, 360, 2, P.terraL); g.r(64, 248, 352, 1, P.gold, 0.7); g.r(64, 261, 352, 1, P.gold, 0.7);
      for (let x = 72; x < 410; x += 16) { g.r(x, 252, 4, 4, P.terra2); g.p(x + 1, 253, P.gold); }
      // the open box, leaning at the right, foam blocks spilled out
      g.r(334, 112, 82, 124, P.woodL); g.r(334, 112, 82, 3, P.cream, 0.6); g.r(410, 112, 6, 124, P.wood);
      g.poly([[334, 112], [342, 96], [350, 96], [344, 112]], P.wood); g.poly([[416, 112], [428, 100], [432, 104], [416, 118]], P.wood);
      g.r(370, 112, 8, 124, P.terraL, 0.6); g.r(346, 150, 52, 30, P.wood, 0.25);
      [[428, 222, 22, 14], [452, 228, 16, 10], [318, 228, 14, 8]].forEach(([x, y, w, h]) => { g.r(x, y, w, h, P.creamL); g.r(x, y, w, 1, P.cream); g.r(x + w - 2, y, 2, h, P.cream2); });
      g.r(24, 184, 42, 38, P.brown); g.r(24, 184, 42, 2, P.brownL); g.r(28, 188, 34, 30, P.blue2); // the picture, leaned against the skirting
      g.oval(45, 210, 14, 7, P.leaf, 0.8); g.oval(38, 196, 5, 4, P.goldL); g.r(26, 222, 44, 2, P.ink, 0.25);
      // the TV, leaning back against the wall: a little narrower at the top
      g.poly([[152, 238], [330, 238], [326, 244], [156, 244]], P.ink, 0.25);
      g.poly([[156, 98], [324, 98], [330, 238], [150, 238]], P.ink);
      g.poly([[161, 103], [319, 103], [324, 232], [156, 232]], P.slate2);
      g.dith(162, 104, 156, 60, P.blue3, 0, 0.35); g.dith(160, 164, 162, 66, P.blue3, 0, 0.15);
      g.r(156, 98, 168, 1, P.slate); g.r(236, 232, 8, 4, P.slate); g.p(318, 234, P.terra); // brand-free chin and a standby light
      // its stand feet, still in their bag, and the wall bracket and screws on the rug
      g.r(108, 228, 30, 10, P.blue2, 0.6); g.r(112, 232, 8, 4, P.slate); g.r(124, 230, 10, 6, P.slate);
      g.r(176, 250, 50, 4, P.slate); g.r(176, 250, 50, 1, P.blue2); g.r(184, 246, 4, 12, P.slate); g.r(214, 246, 4, 12, P.slate);
      [[234, 252], [238, 254], [242, 251]].forEach(([x, y]) => { g.r(x, y, 3, 1, P.slate2); g.p(x, y - 1, P.blue2); });
      // the drill, on its side on the rug
      g.r(256, 246, 32, 10, P.blue); g.r(256, 246, 32, 2, P.blueL); g.r(288, 248, 6, 6, P.ink); g.r(294, 250, 10, 2, P.slate);
      g.r(264, 256, 10, 10, P.blue3); g.r(260, 264, 18, 4, P.slate2); g.r(266, 258, 2, 4, P.ink, 0.5);
    });
    // the stud finder: a little puck with a window and an indicator light on top
    const finder = W.paint(22, 16, g => {
      g.r(2, 14, 20, 2, P.ink, 0.25);
      g.r(0, 2, 20, 12, P.gold); g.r(0, 2, 20, 2, P.goldL); g.r(18, 2, 2, 12, P.brownL); g.r(1, 12, 18, 2, P.brownL, 0.6);
      g.r(4, 6, 12, 4, P.slate2); g.r(9, 0, 2, 2, P.brown); // window and notch
    });
    const led = W.paint(2, 2, g => { g.r(0, 0, 2, 2, P.terra); g.p(0, 0, P.terraL); });
    const ledOn = W.paint(4, 4, g => { g.oval(2, 2, 2, 2, P.leafL); g.p(1, 1, P.creamL); });
    const glint = W.paint(40, 130, g => { g.poly([[18, 0], [30, 0], [12, 130], [0, 130]], P.creamL, 0.18); g.poly([[34, 0], [38, 0], [20, 130], [16, 130]], P.creamL, 0.12); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    // the screen's reflection glint, clipped to the glass
    const glass = kit.h('<div style="position:absolute;left:' + W.px(162) + 'px;top:' + W.px(104) + 'px;width:' + W.px(156) + 'px;height:' + W.px(128) + 'px;overflow:hidden"></div>');
    this.glint = W.layer(kit, glint, 0, 0, 40, 130);
    glass.append(this.glint);
    this.finder = W.layer(kit, finder, 0, 54, 22, 16);
    this.led = W.layer(kit, led, 10, 7, 2, 2); this.ledOn = W.layer(kit, ledOn, 9, 6, 4, 4);
    this.finder.append(this.led, this.ledOn);
    cam.append(glass, this.finder);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    const f = v => ((v % 1) + 1) % 1;
    // the stud finder slides along the tape line, back and forth
    const cx = Math.round(224 + Math.sin(t * 0.9) * 110);
    this.finder.style.left = W.px(cx - 10) + 'px';
    // over a pencil-marked stud it glows steady green; between studs the red light blinks
    const near = [128, 192, 256, 320].some(s => Math.abs(cx - s) < 4);
    this.ledOn.style.opacity = near ? 1 : 0;
    this.led.style.opacity = !near && Math.floor(t * 4) % 2 === 0 ? 1 : 0;
    // now and then a glint slides across the black screen
    const q = f(t / 4);
    this.glint.style.left = W.px(-40 + Math.min(1, q / 0.35) * 200) + 'px';
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
