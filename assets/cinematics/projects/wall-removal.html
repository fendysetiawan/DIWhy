<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: wall</title>
<!-- Project scene: open up the floor plan. The "before": the living-room wall that boxes in the kitchen,
     a narrow doorway with the kitchen glimpsed beyond, a hammer leaning on the wall, a crack that puffs dust
     and sheds chips, a picture that rattles, the kitchen light flickering. A loop.
     Open it to watch it on its own (add ?controls for pause/restart/sound). -->
<link rel="stylesheet" href="../shared/cinematic.css">
</head>
<body>
<script src="../shared/player.js"></script>
<script src="../shared/pixel-art.js"></script>
<script id="scene">
Cinematic.scene("wall-removal", {
  duration: 6,
  holdEnd: true, // keeps crumbling for as long as it's on screen
  cues: [],
  init(kit) {
    const P = W.pal(kit);
    // The living-room wall, straight on, on the 480 x 270 art grid. Lit from the upper left.
    const room = W.paint(480, 270, g => {
      // the wall, with faint drywall seams
      g.r(0, 0, 480, 214, P.cream2);
      for (let x = 0; x < 480; x += 64) { g.r(x, 0, 1, 214, P.peach, 0.35); g.r(x + 1, 0, 1, 214, P.creamL, 0.35); }
      for (let k = 0; k < 5; k++) g.oval(80, 30, 200 - k * 30, 120 - k * 20, P.goldL, 0.05);
      // the kitchen beyond the doorway: back wall, tiles, cabinets, a counter
      g.r(180, 60, 120, 154, P.peach);
      for (let y = 112; y < 146; y += 6) for (let x = 180 + (y % 12 ? 0 : 6); x < 300; x += 12) { g.r(x, y, 11, 5, P.blue2); g.r(x, y, 11, 1, P.creamL, 0.6); }
      g.r(184, 66, 112, 36, P.wood); g.r(184, 66, 112, 2, P.woodL);
      [[186, 54], [242, 52]].forEach(([x, w]) => { g.r(x, 70, w, 30, P.woodL, 0.4); g.r(x + w - 8, 84, 2, 6, P.gold); });
      g.r(180, 146, 120, 6, P.slate2); g.r(180, 146, 120, 1, P.creamL, 0.5);
      g.r(184, 152, 112, 56, P.wood2); g.r(238, 156, 1, 50, P.ink, 0.4); g.r(230, 172, 2, 6, P.gold); g.r(245, 172, 2, 6, P.gold);
      for (let y = 208; y < 214; y += 3) for (let x = 180 + (y % 6 ? 3 : 0); x < 300; x += 6) g.r(x, y, 3, 3, P.creamL);
      g.r(180, 60, 120, 4, P.ink, 0.25); g.r(180, 60, 4, 154, P.ink, 0.2); // shade inside the opening
      g.r(238, 60, 4, 8, P.slate); // the pendant cord
      // the doorway trim
      g.r(174, 54, 132, 6, P.creamL); g.r(174, 54, 6, 160, P.creamL); g.r(300, 54, 6, 160, P.cream); g.r(305, 54, 1, 160, P.peach);
      // the crack, running up from the doorway corner
      const crack = (x0, y0, steps) => { let cx = x0, cy = y0; steps.forEach(([dx, dy]) => {
        for (let s = 0; s < 8; s++) { const X = Math.round(cx + dx * s / 8), Y = Math.round(cy + dy * s / 8); g.r(X, Y, 2, 1, P.brown2); g.p(X + 2, Y, P.creamL, 0.7); g.p(X - 1, Y, P.peach, 0.6); }
        cx += dx; cy += dy; }); };
      crack(306, 56, [[6, -6], [4, -8], [8, -4], [2, -8], [6, -6], [4, -9]]);
      crack(336, 15, [[6, -2], [8, -5], [4, -4]]); crack(316, 36, [[-4, -6], [-2, -8]]);
      g.oval(338, 14, 7, 5, P.peach2, 0.8); g.oval(337, 13, 4, 3, P.peach, 0.9); // a bitten-out patch
      // skirting and floor planks
      g.r(0, 214, 480, 6, P.creamL); g.r(0, 219, 480, 2, P.peach2);
      g.r(0, 221, 480, 49, P.wood);
      for (let y = 221, i = 0; y < 270; y += 12, i++) {
        g.r(0, y, 480, 1, P.woodL); g.r(0, y + 11, 480, 1, P.wood2);
        const j = (i % 2 ? 90 : 260) + (i * 53) % 80; g.r(j, y + 1, 1, 10, P.wood2); g.r(j + 180, y + 1, 1, 10, P.wood2);
      }
      // a little drift of plaster dust and chips under the crack
      g.oval(326, 222, 18, 3, P.creamL, 0.8); g.oval(330, 221, 8, 2, P.cream, 0.9);
      [[316, 223], [338, 224], [344, 222], [322, 225]].forEach(([x, y]) => g.r(x, y, 2, 1, P.cream));
      // the hammer leaning on the wall
      g.r(360, 230, 26, 2, P.ink, 0.25);
      g.poly([[370, 230], [375, 230], [393, 146], [388, 145]], P.woodL); g.poly([[373, 230], [375, 230], [393, 146], [391, 146]], P.wood2);
      g.poly([[376, 140], [404, 146], [403, 154], [375, 148]], P.slate); g.poly([[376, 140], [404, 146], [404, 148], [376, 142]], P.blueL, 0.6);
      g.r(374, 138, 6, 12, P.slate); g.r(374, 138, 2, 12, P.blueL, 0.5); g.r(402, 147, 3, 6, P.slate2);
      // a stud-finder pencil mark on the wall
      g.r(424, 120, 1, 14, P.brownL); g.r(420, 126, 9, 1, P.brownL);
    });
    // a picture frame, drawn on its own so it can rattle on its nail
    const frame = W.paint(56, 42, g => {
      g.r(2, 40, 52, 2, P.ink, 0.2);
      g.r(0, 0, 54, 40, P.wood); g.r(0, 0, 54, 2, P.woodL); g.r(0, 0, 2, 40, P.woodL);
      g.r(5, 5, 44, 30, P.blue2); g.r(5, 24, 44, 11, P.grass); g.oval(18, 24, 12, 7, P.grass2); g.oval(38, 12, 4, 4, P.goldL);
    });
    const glow = W.paint(40, 24, g => { for (let k = 0; k < 4; k++) g.oval(20, 6, 20 - k * 4, 18 - k * 4, P.goldL, 0.15); g.r(14, 0, 12, 6, P.terra); g.r(14, 0, 12, 1, P.terraL); });
    const chip = W.paint(3, 2, g => { g.r(0, 0, 3, 2, P.cream); g.p(0, 0, P.creamL); });
    const puff = W.paint(12, 12, g => { g.oval(6, 6, 6, 6, P.creamL, 0.9); g.oval(5, 5, 3, 3, P.cream, 0.5); });

    const cam = kit.h('<div class="cam" style="width:1920px;height:1080px"></div>');
    cam.append(W.layer(kit, room, 0, 0, 480, 270));
    this.glow = W.layer(kit, glow, 220, 68, 40, 24);
    this.frame = W.layer(kit, frame, 64, 84, 56, 42);
    this.chips = [0, 1, 2].map(() => W.layer(kit, chip, 0, 0, 3, 2));
    this.puffs = [0, 1, 2, 3].map(() => W.layer(kit, puff, 0, 0, 12, 12));
    cam.append(this.glow, this.frame, ...this.chips, ...this.puffs);
    const root = kit.h('<div class="ground" style="background:var(--cream2)"></div>');
    root.append(cam);
    kit.stage.append(root);
  },
  render(t) {
    const c = ((t % 3) + 3) % 3; // the wall "gives" every three seconds
    // the picture rattles on its nail when the wall gives, then settles
    const k = Math.floor(t * 14) % 4;
    const dx = c < 0.5 ? [0, 1, 0, -1][k] : 0, dy = c < 0.5 ? [0, 0, -1, 0][k] : 0;
    this.frame.style.transform = 'translate(' + W.px(dx) + 'px,' + W.px(dy) + 'px)';
    // the kitchen light flickers on a bad connection
    this.glow.style.opacity = [1, 1, 1, 0.35, 1, 1, 0.7, 1, 1, 1, 1, 0.25][Math.floor(t * 10) % 12];
    // chips flake off the crack and drop to the floor
    this.chips.forEach((p, i) => {
      const q = ((t * 0.45 + i / 3) % 1 + 1) % 1;
      p.style.left = W.px(314 + i * 8 + Math.sin(q * 9 + i) * 2) + 'px'; p.style.top = W.px(36 + i * 4 + q * q * 182) + 'px';
      p.style.opacity = q > 0.97 ? 0 : 1;
    });
    // a puff of plaster dust bursts from the crack
    this.puffs.forEach((p, i) => {
      const q = Math.min(1, Math.max(0, (c - i * 0.08) / 1.2));
      p.style.left = W.px(318 + i * 5 + q * (i - 1.5) * 10) + 'px'; p.style.top = W.px(14 + i * 8 + q * 14) + 'px';
      p.style.opacity = (q <= 0 || q >= 1 ? 0 : q < 0.1 ? q * 9 : 0.9 - q * 0.9).toFixed(2);
      p.style.transform = 'scale(' + (0.6 + q * 1.4).toFixed(2) + ')';
    });
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
