<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DIWHY: sold</title>
<!-- Scene: the house is sold. Open it to watch it on its own (add ?controls for pause/restart/sound).
     The app loads the "scene" style and script from this file. -->
<link rel="stylesheet" href="shared/cinematic.css">
<style id="scene-style">
/* scene 2: sold! - words on the yard sign (panel is art 114..154 x 158..177) */
.film .sold-sign { position: absolute; left: 456px; top: 632px; width: 160px; height: 76px; display: grid; place-items: center;
  font: 16px/16px "Press Start 2P", monospace; color: #d7263d; background: #ffffff; white-space: nowrap; }
/* the red SOLD! stamp, centred on the sign, over FOR SALE */
.film .sold-stamp { position: absolute; left: 536px; top: 670px; padding: 6px 8px; border: 4px solid #d7263d; border-radius: 4px;
  font: 24px/24px "Press Start 2P", monospace; color: #d7263d; white-space: nowrap; opacity: 0; }
</style>
</head>
<body>
<script src="shared/player.js"></script>
<script src="shared/pixel-art.js"></script>
<script id="scene">
// The yard sign says FOR SALE; then a red SOLD! stamp lands on it. In the app the stamp comes when the
// player clicks NEXT (scene.send("stamp")); on its own the scene stamps at 2.5 s (`auto`).
const SOLD_SIGN = "FOR SALE";
const SOLD_STAMP = "SOLD!";

Cinematic.scene("sold", {
  duration: 13,
  holdEnd: true, // keeps drifting after 13 s (the app talks over it)
  auto: [[2.5, "stamp"]],
  stamp(kit, t) { if (this.stampedAt == null) { this.stampedAt = t; kit.sound("thud"); } },
  reset() { this.stampedAt = null; },
  // [seconds, sound] - sounds are listed in player.js
  cues: [
    [0.4, "whoosh"],
  ],
  init(kit) {
    const P = W.pal(kit);
    // The yard from above at a three-quarter angle: lawn, stepping stones, picket fence, sidewalk and street.
    // Low morning sun from the left throws long shadows to the right.
    const bg = W.paint(500, 285, g => {
      const r = W.rng(11);
      g.r(0, 0, 500, 285, P.grass);
      for (let k = 0; k < 2600; k++) g.p(r() * 500, r() * 214, r() < 0.55 ? P.grass2 : P.grassL);
      for (let k = 0; k < 200; k++) { const x = r() * 500, y = r() * 210; g.p(x, y, P.grassL); g.p(x + 2, y, P.grassL); g.p(x + 1, y + 1, P.grass2); }
      for (let k = 0; k < 14; k++) g.oval(30 + r() * 170, 40 + r() * 100, 14 + r() * 16, 6 + r() * 8, P.leaf3, 0.16);
      // street, curb, sidewalk
      g.r(0, 240, 500, 45, P.slate); for (let k = 0; k < 500; k++) g.p(r() * 500, 241 + r() * 44, r() < 0.5 ? P.slate2 : P.brownL, 0.6);
      for (let x = 8; x < 500; x += 44) g.r(x, 262, 20, 2, P.gold);
      g.r(0, 234, 500, 6, P.cream2); g.r(0, 234, 500, 1, P.creamL); g.r(0, 239, 500, 1, P.peach2);
      g.r(0, 216, 500, 18, P.cream); for (let x = 0; x < 500; x += 18) g.r(x, 216, 1, 18, P.peach, 0.7); g.r(0, 225, 500, 1, P.peach, 0.6); g.r(0, 214, 500, 2, P.grass2);
      // stepping stones curving from the gate to the porch
      for (let i = 0; i <= 7; i++) { const t = i / 7, x = (1 - t) * (1 - t) * 198 + 2 * (1 - t) * t * 250 + t * t * 330, y = (1 - t) * (1 - t) * 210 + 2 * (1 - t) * t * 214 + t * t * 198;
        g.oval(x + 2, y + 1, 8, 4, P.ink, 0.25); g.oval(x, y, 8, 4, P.peach); g.oval(x - 1, y - 1, 7, 3, P.cream2); g.p(x - 4, y - 2, P.creamL); }
      // long shadows to the right
      g.poly([[420, 190], [420, 150], [478, 176], [484, 206], [404, 206]], P.ink, 0.22);
      g.poly([[262, 190], [402, 190], [404, 206], [290, 200]], P.ink, 0.12);
      g.poly([[140, 190], [182, 196], [182, 199], [140, 194]], P.ink, 0.25);
      g.poly([[118, 178], [158, 178], [196, 188], [160, 190]], P.ink, 0.18);
      g.oval(482, 140, 30, 9, P.ink, 0.22);
      // a tree behind the house on the right
      g.r(458, 106, 6, 30, P.brown); g.r(458, 106, 2, 30, P.brownL);
      g.bush(462, 92, 34, 28, P, 21);
      // the house: side wall, front wall, roof, chimney
      g.r(402, 140, 18, 50, P.peach); for (let y = 146; y < 186; y += 6) g.r(402, y, 18, 1, P.peach2, 0.7); g.r(402, 186, 18, 4, P.brown); g.r(418, 140, 2, 50, P.ink, 0.3);
      g.r(262, 136, 140, 54, P.cream2); g.r(262, 136, 3, 54, P.creamL); for (let y = 142; y < 186; y += 6) g.r(262, y, 140, 1, P.peach, 0.55);
      g.r(262, 186, 140, 4, P.brownL); g.r(262, 140, 140, 4, P.ink, 0.18);
      [[278, 'L'], [354, 'R']].forEach(([wx]) => {
        g.r(wx, 146, 34, 28, P.cream); g.r(wx + 3, 149, 28, 22, P.blueL); g.r(wx + 3, 149, 28, 8, P.blue2);
        for (let i = 0; i < 10; i++) { g.p(wx + 6 + i, 160 - i, P.creamL); g.p(wx + 14 + i, 168 - i, P.creamL); }
        g.r(wx + 16, 149, 2, 22, P.cream); g.r(wx + 3, 159, 28, 2, P.cream); g.r(wx - 2, 174, 38, 3, P.cream2); g.r(wx - 2, 177, 38, 1, P.peach2);
        g.r(wx, 178, 34, 5, P.terra); g.r(wx, 178, 34, 1, P.terraL); g.r(wx, 182, 34, 1, P.terra2);
        for (let k = 0; k < 10; k++) { g.p(wx + 2 + k * 3, 177, P.leaf2); g.p(wx + 2 + k * 3, 176, [P.pink, P.gold, P.violet][k % 3]); }
      });
      g.r(320, 154, 22, 36, P.wood2); g.r(322, 156, 18, 34, P.wood); g.r(325, 159, 5, 12, P.wood2, 0.6); g.r(332, 159, 5, 12, P.wood2, 0.6); g.r(325, 175, 5, 12, P.wood2, 0.6); g.r(332, 175, 5, 12, P.wood2, 0.6);
      g.r(322, 156, 1, 34, P.woodL); g.p(337, 173, P.gold); g.p(337, 174, P.goldL); g.r(345, 160, 3, 5, P.gold); g.p(345, 160, P.goldL);
      g.r(314, 190, 34, 4, P.cream2); g.r(314, 190, 34, 1, P.creamL); g.r(314, 194, 34, 2, P.peach2);
      for (let y = 82; y < 140; y++) { const q = (y - 82) / 58, lx = Math.round(270 - 16 * q), rx = Math.round(402 + 18 * q), row = Math.floor((y - 82) / 6); g.r(lx, y, rx - lx, 1, (y - 82) % 6 === 5 ? P.terra2 : P.terra);
        if ((y - 82) % 6 === 0) for (let x = lx + (row % 2) * 5; x < rx; x += 10) g.r(x, y, 1, 6, P.terra2); g.r(rx - 6, y, 6, 1, P.terra2, 0.6); }
      g.dith(272, 86, 34, 50, P.terraL, 0, 0.55);
      g.r(268, 78, 136, 6, P.terra2); g.r(268, 78, 136, 2, P.terraL); g.r(252, 138, 170, 3, P.wood2);
      g.r(372, 58, 14, 32, P.terra2); for (let y = 60; y < 90; y += 4) g.r(372, y, 14, 1, P.wood2, 0.6); g.r(372, 58, 2, 32, P.terra); g.r(370, 55, 18, 4, P.brown); g.r(370, 55, 18, 1, P.brownL); g.r(386, 60, 4, 30, P.ink, 0.2);
      // flower beds and bushes
      [[262, 52], [348, 54]].forEach(([x0, w]) => { g.r(x0, 192, w, 7, P.brown); g.r(x0, 192, w, 1, P.brownL);
        for (let x = x0 + 1; x < x0 + w - 1; x += 3) { g.p(x, 194, P.leaf2); g.p(x + 1, 193, P.leaf); g.p(x, 192, [P.pink, P.gold, P.violet, P.creamL][(x >> 1) % 4]); } });
      g.bush(254, 186, 13, 10, P, 3); g.bush(412, 182, 13, 10, P, 4);
      // the yard sign, blank: the game lays its own words on top
      g.r(137, 168, 4, 26, P.brown); g.r(137, 168, 1, 26, P.brownL);
      g.r(116, 160, 42, 20, P.ink, 0.3); g.r(114, 158, 42, 20, P.cream2); g.r(114, 158, 42, 1, P.creamL); g.r(154, 158, 2, 20, P.peach); g.r(114, 177, 42, 1, P.peach2);
      for (let y = 163; y < 176; y += 4) g.r(117, y, 34, 1, P.cream, 0.7);
      g.r(118, 151, 34, 7, P.terra); g.r(118, 151, 34, 1, P.terraL); g.r(150, 151, 2, 7, P.terra2);
      // picket fence with a gate gap for the path
      [[0, 186], [214, 500]].forEach(([a, b]) => { g.r(a, 203, b - a, 2, P.cream2); g.r(a, 209, b - a, 2, P.cream2); g.r(a, 205, b - a, 1, P.peach, 0.6);
        for (let x = a; x < b; x += 7) { g.r(x + 4, 200, 3, 16, P.ink, 0.15); g.r(x, 198, 4, 16, P.cream); g.r(x + 3, 198, 1, 16, P.peach); g.r(x + 1, 197, 2, 1, P.cream); g.r(x, 198, 1, 1, P.creamL); } });
    });
    // Foreground canopy cropping the top-left corner, for depth.
    const fg = W.paint(220, 160, g => { g.bush(70, 40, 80, 52, P, 31); g.bush(150, 26, 54, 36, P, 32); g.bush(28, 108, 52, 46, P, 33); g.bush(118, 84, 44, 30, P, 34); });
    const rays = W.paint(500, 285, g => { for (let k = 0; k < 5; k++) { const x0 = -40 + k * 70; g.poly([[x0, 0], [x0 + 26 + k * 4, 0], [x0 + 236, 285], [x0 + 210, 285]], P.goldL, 0.09); } g.oval(60, 40, 240, 160, P.goldL, 0.08); });
    const cloud = W.paint(120, 46, g => { g.oval(60, 24, 58, 20, P.ink, 0.13); g.oval(40, 18, 30, 12, P.ink, 0.05); g.oval(82, 28, 28, 12, P.ink, 0.05); });
    const birdUp = W.paint(9, 5, g => { g.p(0, 0, P.ink); g.p(8, 0, P.ink); g.r(1, 1, 2, 1, P.brown2); g.r(6, 1, 2, 1, P.brown2); g.r(3, 2, 3, 1, P.brown2); g.p(4, 3, P.brown2); });
    const birdDn = W.paint(9, 5, g => { g.r(0, 2, 3, 1, P.brown2); g.r(6, 2, 3, 1, P.brown2); g.r(3, 2, 3, 1, P.brown2); g.p(4, 3, P.brown2); g.p(0, 3, P.ink); g.p(8, 3, P.ink); });
    const bshadow = W.paint(6, 2, g => g.r(0, 0, 6, 2, P.ink, 0.25));
    const puff = W.paint(8, 8, g => { g.oval(4, 4, 4, 4, P.creamL, 0.85); g.oval(3, 3, 2, 2, P.creamL); });
    const world = kit.h('<div class="cam sold-world" style="width:2000px;height:1140px"></div>');
    world.append(W.layer(kit, bg, 0, 0, 500, 285, 'sold-yard'));
    this.clouds = [0, 1].map(k => { const c = W.layer(kit, cloud, 0, 0, 120, 46, 'sold-cloud'); world.append(c); return c; });
    this.puffs = [0, 1, 2, 3, 4].map(() => { const p = W.layer(kit, puff, 0, 0, 8, 8, 'sold-smoke'); world.append(p); return p; });
    this.rays = W.layer(kit, rays, 0, 0, 500, 285, 'sold-rays'); world.append(this.rays);
    this.birds = [0, 1, 2].map(() => { const u = W.layer(kit, birdUp, 0, 0, 9, 5, 'sold-bird'), d = W.layer(kit, birdDn, 0, 0, 9, 5, 'sold-bird'), s = W.layer(kit, bshadow, 0, 0, 6, 2, 'sold-bird-shadow'); world.append(s); return { u, d, s }; });
    this.fg = W.layer(kit, fg, -40, -46, 220, 160, 'sold-canopy');
    // the sign's words (the painted sign is blank)
    this.signEl = kit.h('<div class="sold-sign">' + SOLD_SIGN + '</div>');
    world.append(this.signEl);
    this.stampEl = kit.h('<div class="sold-stamp">' + SOLD_STAMP + '</div>');
    world.append(this.stampEl);
    // everything is zoomed 1.25x (art pixels stay whole: 4 px -> 5 px), framed on the sign and the house
    const root = kit.h('<div class="ground" style="background:var(--grass, #7DB646);transform-origin:0 0;transform:translate(-400px, -160px) scale(1.25)"></div>');
    root.append(world); this.birds.forEach(b => root.append(b.u, b.d)); root.append(this.fg);
    kit.stage.append(root); this.world = world;
  },
  render(t, kit) {
    const e = eio(seg(t, 0, 13));
    // the stamp lands big and slams down onto the sign in a blink
    const on = this.stampedAt != null && t >= this.stampedAt;
    this.stampEl.style.opacity = on ? 1 : 0;
    this.signEl.style.color = on ? 'transparent' : ''; // stamped: FOR SALE goes, the sign is just white with SOLD! on it
    if (on) this.stampEl.style.transform = 'translate(-50%, -50%) rotate(-12deg) scale(' + lerp(3, 1, seg(t, this.stampedAt, this.stampedAt + 0.12)).toFixed(3) + ')';
    this.world.style.transform = 'translate(' + W.px(-10) + 'px,' + W.px(-8) + 'px)';
    this.fg.style.transform = 'translate(' + W.px(-14) + 'px,' + W.px(-10) + 'px)';
    this.rays.style.opacity = lerp(0.35, 1, eo(seg(t, 0, 10))).toFixed(3);
    [[-120, 30, 5], [160, 150, 4]].forEach(([x0, y, v], k) => { const c = this.clouds[k]; c.style.left = W.px(((x0 + t * v) % 640 + 640) % 640 - 120) + 'px'; c.style.top = W.px(y) + 'px'; });
    this.puffs.forEach((p, k) => { const q = ((t * 0.3 + k / 5) % 1 + 1) % 1; p.style.left = W.px(375 + q * 22 + Math.sin(q * 6 + k) * 2) + 'px'; p.style.top = W.px(48 - q * 40) + 'px'; p.style.opacity = q < 0.1 ? q * 8 : 0.9 - q * 0.8; });
    const q = seg(t, 1.5, 11);
    this.birds.forEach((b, k) => {
      const x = Math.round(lerp(500, -40, q)) + k * 11, y = 26 + k * 7 + Math.round(Math.sin(t * 1.6 + k) * 2), f = (Math.floor(t * 3) + k) % 2, on = q > 0 && q < 1 ? 1 : 0;
      b.u.style.left = b.d.style.left = W.px(x) + 'px'; b.u.style.top = b.d.style.top = W.px(y) + 'px';
      b.u.style.opacity = on * f; b.d.style.opacity = on * (1 - f);
      b.s.style.left = W.px(x + 26 + 20 * e) + 'px'; b.s.style.top = W.px(y + 70 + 14 * e) + 'px'; b.s.style.opacity = on;
    });
  },
});
</script>
<script>Cinematic.page();</script>
</body>
</html>
