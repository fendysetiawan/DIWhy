<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIWHY?! — Desktop</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<!-- The desktop: the main background, with the DIY icon on it -->
<div id="desktop">
  <canvas id="bg-sky" aria-hidden="true"></canvas>
  <canvas id="bg-land" aria-hidden="true"></canvas>
  <button class="desk-icon" id="diy-icon">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <path d="M6 24 L24 8 L42 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M33 16 V9 H38 V20" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="11" y="23" width="26" height="19" rx="1.5" fill="#f3c77a" stroke="#fff" stroke-width="2.5" />
      <rect x="20" y="30" width="8" height="12" fill="#d64541" />
    </svg>
    <span>DIY</span>
  </button>
</div>

  <script src="background.js"></script>
  <script src="xp-window.js"></script>
  <script>
    startBackground(document.getElementById("bg-sky"), document.getElementById("bg-land"));
    document.getElementById("diy-icon").addEventListener("click", () => {
      if (!document.querySelector(".xp-window")) openXPWindow({ title: "DIY" });
    });
  </script>
</body>
</html>
